<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Fitness Tracker</title>
    <meta name="description" content="Full Body A/B workout tracker" />
    <meta name="application-name" content="Fitness Tracker" />
    <meta name="apple-mobile-web-app-title" content="Fitness Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#161618" id="theme-color" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        if (t === 'light') document.getElementById('theme-color').content = '#f5f5f7';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
